<!doctype html>
<html>
<head>
  <meta charset="UTF-8">
  <title>Ancestry Case Downloader</title>

  <style>
    body {
      font-family: Arial, sans-serif;
      width: 310px;
      padding: 16px;
    }

    h2 {
      margin-top: 0;
      font-size: 18px;
    }

    .field {
      margin: 14px 0;
    }

    label {
      display: block;
      margin-bottom: 5px;
      font-weight: bold;
    }

    input {
      box-sizing: border-box;
      width: 100%;
      padding: 8px;
      font-size: 14px;
    }

    button {
      width: 100%;
      padding: 10px;
      font-size: 15px;
      cursor: pointer;
    }

    #current {
      font-size: 16px;
      font-weight: bold;
    }

    #status {
      margin-top: 14px;
      line-height: 1.4;
    }

    .error {
      color: #b00020;
    }

    .success {
      font-weight: bold;
    }
  </style>
</head>

<body>
  <h2>Ancestry Case Downloader</h2>

  <div>
    Starting image:
    <span id="current">Reading...</span>
  </div>

  <div class="field">
    <label for="caseName">Case name</label>
    <input
      id="caseName"
      type="text"
      placeholder="Tom Sing case"
    >
  </div>

  <div class="field">
    <label for="endPage">Last image</label>
    <input
      id="endPage"
      type="number"
      min="1"
      placeholder="263"
    >
  </div>
  
  <!-- Download JPGs and combines into one PDF -->
  <button id="start" disabled>
    Download imgs separately AND combine into PDF
  </button>

  <div id="status"></div>

  <script src="popup.js"></script>
</body>
</html>
