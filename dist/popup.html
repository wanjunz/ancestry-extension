<!doctype html>
<html>
<head>
  <meta charset="UTF-8">
  <title>Ancestry Case Downloader</title>

  <style>
    body {
      font-family: Arial, sans-serif;
      width: 310px;
      padding: 16px;
    }

    h2 {
      margin-top: 0;
      font-size: 18px;
    }

    .field {
      margin: 14px 0;
    }

    .fieldRow {
      display: flex;
      gap: 12px;
    }

    .fieldRow .field {
      flex: 1;
      margin: 14px 0;
    }

    label {
      display: block;
      margin-bottom: 5px;
      font-weight: bold;
    }

    input {
      box-sizing: border-box;
      width: 100%;
      padding: 8px;
      font-size: 14px;
    }

    button {
      width: 100%;
      padding: 10px;
      font-size: 15px;
      cursor: pointer;
    }

    #current {
      display: block;
      box-sizing: border-box;
      padding: 8px 0;
      border: 1px solid transparent;
      font-size: 16px;
      font-weight: bold;
    }

    #status {
      margin-top: 14px;
      line-height: 1.4;
    }

    .error {
      color: #b00020;
    }

    .success {
      font-weight: bold;
    }
    .startButton {
      background-color: #B0B940;
      margin: 4px 0;
      color: #fff;
    }
    .startButton:hover {
      background-color: #82892D;
    }

    .stopButton {
      margin-top: 14px;
      background-color: #9E9E9E;
      color: #fff;
      
    }

    .stopButton:hover:not(:disabled) {
      background-color: #C0392B;
    }
    .stopButton:not(:disabled) {
      background-color: #922B21;
    }
  </style>
</head>

<body>
  <h2>Ancestry Case Downloader</h2>

  

  <div class="field">
    <label for="caseName">File name</label>
    <input
      id="caseName"
      type="text"
      placeholder="Tom Sing case"
    >
  </div>

  <div class="fieldRow">
    <div class="field">
      <label for="current">Starting page</label>
      <span id="current">Reading...</span>
    </div>

    <div class="field">
      <label for="endPage">Last page #</label>
      <input
        id="endPage"
        type="number"
        min="1"
        placeholder="263"
      >
    </div>
  </div>
  
  <!-- Only downloads separate JPGS -->
  <button class = "startButton" id="separate" disabled>
    Download imgs separately
  </button>
  <!-- Only outputs one PDF with all imgs -->
  <button class = "startButton" id="combine" disabled>
    Download one PDF with all imgs
  </button>
  <!-- Download JPGs and combines into one PDF -->
  <button class = "startButton" id="separateNcombine" disabled>
    Download imgs separately AND combine into PDF
  </button>
  <!-- Cancels the in-progress job; PDF modes still return a partial PDF -->
  <button class = "stopButton" id="stop" disabled>
    STOP
  </button>

  <div id="status"></div>

  <script src="popup.js"></script>
</body>
</html>
